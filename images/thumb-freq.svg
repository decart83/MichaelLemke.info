<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Letter Frequency">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1626"/><stop offset="1" stop-color="#16233c"/>
    </linearGradient>
    <linearGradient id="barfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1d5f86"/>
    </linearGradient>
    <linearGradient id="barhot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow4"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg4)"/>
  <!-- baseline -->
  <line x1="90" y1="580" x2="1110" y2="580" stroke="#31415e" stroke-width="4"/>
  <!-- bars: E T A O I N S R -->
  <g>
    <rect x="110"  y="160" width="90" height="420" rx="14" fill="url(#barhot)" filter="url(#glow4)"/>
    <rect x="235"  y="235" width="90" height="345" rx="14" fill="url(#barfill)"/>
    <rect x="360"  y="265" width="90" height="315" rx="14" fill="url(#barfill)"/>
    <rect x="485"  y="290" width="90" height="290" rx="14" fill="url(#barfill)"/>
    <rect x="610"  y="315" width="90" height="265" rx="14" fill="url(#barfill)"/>
    <rect x="735"  y="330" width="90" height="250" rx="14" fill="url(#barfill)"/>
    <rect x="860"  y="360" width="90" height="220" rx="14" fill="url(#barfill)"/>
    <rect x="985"  y="385" width="90" height="195" rx="14" fill="url(#barfill)"/>
  </g>
  <!-- letters -->
  <g font-family="'Courier New', Courier, monospace" font-size="64" font-weight="700" text-anchor="middle">
    <text x="155"  y="675" fill="#fbbf24">E</text>
    <text x="280"  y="675" fill="#9fb3cd">T</text>
    <text x="405"  y="675" fill="#9fb3cd">A</text>
    <text x="530"  y="675" fill="#9fb3cd">O</text>
    <text x="655"  y="675" fill="#9fb3cd">I</text>
    <text x="780"  y="675" fill="#9fb3cd">N</text>
    <text x="905"  y="675" fill="#9fb3cd">S</text>
    <text x="1030" y="675" fill="#9fb3cd">R</text>
  </g>
  <!-- pct label on E -->
  <text x="155" y="130" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="44" font-weight="700" fill="#fbbf24">12.7%</text>
</svg>
