<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Micro Reparations">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1210"/><stop offset="1" stop-color="#2a1a14"/></linearGradient>
    <linearGradient id="mend" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2a15a"/><stop offset="1" stop-color="#b4471f"/></linearGradient>
    <filter id="mglow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#mbg)"/>
  <!-- broken bowl, kintsugi-style repair -->
  <g transform="translate(600 410)">
    <path d="M-250 -40 C -250 110 -130 190 0 190 C 130 190 250 110 250 -40 Z" fill="#3a2a22" stroke="#5a4236" stroke-width="6"/>
    <ellipse cx="0" cy="-40" rx="250" ry="42" fill="#2b1f19" stroke="#5a4236" stroke-width="6"/>
    <!-- golden seams -->
    <g fill="none" stroke="url(#mend)" stroke-width="9" stroke-linecap="round" filter="url(#mglow)">
      <path d="M-120 -30 C -100 40 -140 90 -90 160"/>
      <path d="M40 -32 C 60 30 20 70 70 140 C 85 160 100 170 120 178"/>
      <path d="M-90 160 C -60 150 -40 120 -20 100"/>
    </g>
  </g>
  <!-- repeating small acts: dots marching -->
  <g fill="#e2a15a" filter="url(#mglow)">
    <circle cx="150" cy="140" r="9"/><circle cx="200" cy="140" r="9"/><circle cx="250" cy="140" r="9"/><circle cx="300" cy="140" r="9" opacity=".6"/><circle cx="350" cy="140" r="9" opacity=".35"/>
  </g>
  <text x="150" y="200" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#c9a98c">small, direct, repeated</text>
</svg>
