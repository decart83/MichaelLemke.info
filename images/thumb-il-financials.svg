<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Illinois School Financials">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1626"/><stop offset="1" stop-color="#16233c"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <!-- choropleth tiles -->
  <g>
    <g transform="translate(90,110)">
      <rect x="0"   y="0"   width="92" height="92" rx="18" fill="#1d3a5f"/>
      <rect x="112" y="0"   width="92" height="92" rx="18" fill="#25537f"/>
      <rect x="224" y="0"   width="92" height="92" rx="18" fill="#38bdf8"/>
      <rect x="0"   y="112" width="92" height="92" rx="18" fill="#2c6ea5"/>
      <rect x="112" y="112" width="92" height="92" rx="18" fill="#173049"/>
      <rect x="224" y="112" width="92" height="92" rx="18" fill="#25537f"/>
      <rect x="0"   y="224" width="92" height="92" rx="18" fill="#38bdf8"/>
      <rect x="112" y="224" width="92" height="92" rx="18" fill="#2c6ea5"/>
      <rect x="224" y="224" width="92" height="92" rx="18" fill="#1d3a5f"/>
      <rect x="0"   y="336" width="92" height="92" rx="18" fill="#173049"/>
      <rect x="112" y="336" width="92" height="92" rx="18" fill="#7dd3fc"/>
      <rect x="224" y="336" width="92" height="92" rx="18" fill="#1d3a5f"/>
    </g>
  </g>
  <!-- rising line + area -->
  <g>
    <path d="M520 600 L680 520 L800 545 L930 400 L1090 300 L1090 640 L520 640 Z" fill="url(#area)"/>
    <path d="M520 600 L680 520 L800 545 L930 400 L1090 300" fill="none" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="930" cy="400" r="16" fill="#0e1626" stroke="#7dd3fc" stroke-width="8"/>
    <circle cx="1090" cy="300" r="16" fill="#0e1626" stroke="#7dd3fc" stroke-width="8"/>
  </g>
  <!-- dollar chip -->
  <g filter="url(#glow)">
    <circle cx="700" cy="240" r="86" fill="#12233c" stroke="#38bdf8" stroke-width="5"/>
    <text x="700" y="278" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="600" fill="#7dd3fc">$</text>
  </g>
</svg>
