<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Rap Family Tree">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141118"/><stop offset="1" stop-color="#1d1526"/>
    </linearGradient>
    <filter id="rglow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#rbg)"/>
  <!-- connection edges -->
  <g stroke="#4b3a5c" stroke-width="6">
    <line x1="220" y1="200" x2="470" y2="330"/>
    <line x1="220" y1="560" x2="470" y2="420"/>
    <line x1="470" y1="330" x2="740" y2="240"/>
    <line x1="470" y1="420" x2="740" y2="520"/>
    <line x1="740" y1="240" x2="990" y2="360"/>
    <line x1="740" y1="520" x2="990" y2="400"/>
    <line x1="470" y1="330" x2="470" y2="420"/>
    <line x1="740" y1="240" x2="740" y2="520"/>
  </g>
  <!-- the highlighted route -->
  <g stroke="#ff4fa3" stroke-width="10" stroke-linecap="round" filter="url(#rglow)">
    <line x1="220" y1="200" x2="470" y2="330"/>
    <line x1="470" y1="330" x2="740" y2="240"/>
    <line x1="740" y1="240" x2="990" y2="360"/>
  </g>
  <!-- nodes -->
  <g>
    <circle cx="220" cy="560" r="34" fill="#2a2135" stroke="#4b3a5c" stroke-width="6"/>
    <circle cx="470" cy="420" r="34" fill="#2a2135" stroke="#4b3a5c" stroke-width="6"/>
    <circle cx="740" cy="520" r="34" fill="#2a2135" stroke="#4b3a5c" stroke-width="6"/>
    <circle cx="990" cy="400" r="34" fill="#2a2135" stroke="#4b3a5c" stroke-width="6"/>
  </g>
  <g filter="url(#rglow)">
    <circle cx="220" cy="200" r="42" fill="#ff4fa3"/>
    <circle cx="470" cy="330" r="38" fill="#f9e04c"/>
    <circle cx="740" cy="240" r="38" fill="#4fe0c4"/>
    <circle cx="990" cy="360" r="42" fill="#ff4fa3"/>
  </g>
  <!-- mic glyph bottom-left -->
  <g stroke="#6d5a80" stroke-width="8" fill="none" stroke-linecap="round">
    <rect x="92" y="640" width="42" height="66" rx="21"/>
    <path d="M72 690 a41 41 0 0 0 82 0"/>
    <line x1="113" y1="731" x2="113" y2="706"/>
  </g>
</svg>
