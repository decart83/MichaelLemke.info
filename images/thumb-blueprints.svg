<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Solution Blueprints Platform">
  <defs>
    <linearGradient id="bpbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2749"/><stop offset="1" stop-color="#123a5e"/>
    </linearGradient>
    <filter id="bpglow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bpbg)"/>
  <!-- blueprint grid -->
  <g stroke="#2b527a" stroke-width="2" opacity="0.7">
    <line x1="0" y1="94" x2="1200" y2="94"/><line x1="0" y1="188" x2="1200" y2="188"/>
    <line x1="0" y1="282" x2="1200" y2="282"/><line x1="0" y1="376" x2="1200" y2="376"/>
    <line x1="0" y1="470" x2="1200" y2="470"/><line x1="0" y1="564" x2="1200" y2="564"/>
    <line x1="0" y1="658" x2="1200" y2="658"/>
    <line x1="100" y1="0" x2="100" y2="750"/><line x1="200" y1="0" x2="200" y2="750"/>
    <line x1="300" y1="0" x2="300" y2="750"/><line x1="400" y1="0" x2="400" y2="750"/>
    <line x1="500" y1="0" x2="500" y2="750"/><line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="700" y1="0" x2="700" y2="750"/><line x1="800" y1="0" x2="800" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/><line x1="1000" y1="0" x2="1000" y2="750"/>
    <line x1="1100" y1="0" x2="1100" y2="750"/>
  </g>
  <!-- schematic: blueprint flow -->
  <g stroke="#e8f4ff" stroke-width="6" fill="none" filter="url(#bpglow)">
    <rect x="180" y="170" width="240" height="130" rx="12"/>
    <rect x="180" y="450" width="240" height="130" rx="12"/>
    <rect x="500" y="310" width="240" height="130" rx="12"/>
    <rect x="820" y="170" width="240" height="130" rx="12" stroke-dasharray="16 12"/>
    <rect x="820" y="450" width="240" height="130" rx="12" stroke-dasharray="16 12"/>
    <path d="M420 235 C 470 235 470 340 505 355"/>
    <path d="M420 515 C 470 515 470 410 505 395"/>
    <path d="M740 355 C 790 340 790 250 815 240"/>
    <path d="M740 395 C 790 410 790 500 815 510"/>
  </g>
  <!-- box glyphs -->
  <g stroke="#7dd3fc" stroke-width="6" stroke-linecap="round">
    <line x1="220" y1="215" x2="380" y2="215"/><line x1="220" y1="250" x2="340" y2="250"/>
    <line x1="220" y1="495" x2="380" y2="495"/><line x1="220" y1="530" x2="340" y2="530"/>
    <line x1="540" y1="355" x2="700" y2="355"/><line x1="540" y1="390" x2="660" y2="390"/>
    <line x1="860" y1="215" x2="1020" y2="215"/><line x1="860" y1="250" x2="980" y2="250"/>
    <line x1="860" y1="495" x2="1020" y2="495"/><line x1="860" y1="530" x2="980" y2="530"/>
  </g>
  <!-- corner compass -->
  <g stroke="#e8f4ff" stroke-width="5" fill="none" opacity="0.9">
    <circle cx="1090" cy="655" r="38"/>
    <line x1="1090" y1="625" x2="1090" y2="640"/>
    <path d="M1090 655 L1112 633" stroke-width="7"/>
  </g>
</svg>
