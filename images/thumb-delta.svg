<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Delta County Historical Society">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101828"/><stop offset="0.75" stop-color="#1a2438"/><stop offset="1" stop-color="#0d1f33"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a5e"/><stop offset="1" stop-color="#0c2740"/>
    </linearGradient>
    <filter id="glow6"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg6)"/>
  <!-- moon -->
  <circle cx="1000" cy="140" r="58" fill="#e8eaed" opacity="0.9"/>
  <circle cx="978" cy="126" r="12" fill="#c3c9d4"/><circle cx="1016" cy="158" r="9" fill="#c3c9d4"/>
  <!-- light beams -->
  <path d="M475 233 L40 126 L40 340 Z" fill="url(#beam2)"/>
  <path d="M475 233 L1160 120 L1160 340 Z" fill="url(#beam)"/>
  <!-- water -->
  <rect y="600" width="1200" height="150" fill="url(#water)"/>
  <g stroke="#2b527a" stroke-width="4" opacity="0.7">
    <line x1="60" y1="640" x2="220" y2="640"/><line x1="300" y1="668" x2="470" y2="668"/>
    <line x1="640" y1="645" x2="800" y2="645"/><line x1="900" y1="676" x2="1080" y2="676"/>
  </g>
  <!-- lighthouse: sand point style — tower + keeper's house -->
  <g>
    <!-- keeper's house -->
    <rect x="530" y="440" width="260" height="160" rx="6" fill="#8f3b2f"/>
    <path d="M515 445 L660 360 L805 445 Z" fill="#5b2720"/>
    <rect x="600" y="500" width="52" height="100" rx="4" fill="#3a1a15"/>
    <rect x="700" y="490" width="48" height="48" rx="4" fill="#fbbf24" opacity="0.85"/>
    <!-- tower -->
    <path d="M420 600 L445 300 L505 300 L530 600 Z" fill="#a8462f"/>
    <rect x="437" y="255" width="76" height="50" rx="6" fill="#3f2a24"/>
    <!-- lantern room -->
    <rect x="443" y="200" width="64" height="58" rx="8" fill="#16233c" stroke="#3f2a24" stroke-width="6"/>
    <circle cx="475" cy="229" r="17" fill="#fbbf24" filter="url(#glow6)"/>
    <path d="M437 200 L475 168 L513 200 Z" fill="#5b2720"/>
    <!-- tower stripes -->
    <rect x="432" y="430" width="86" height="22" fill="#e8eaed" opacity="0.85"/>
  </g>
</svg>
